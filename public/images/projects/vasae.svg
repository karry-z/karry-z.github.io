<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">VASAE sparse autoencoder flow</title>
  <desc id="desc">Residual stream, sparse code, dictionary direction, and token anchor connected in a flow.</desc>
  <rect width="640" height="400" rx="28" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="4">
    <rect x="42" y="150" width="130" height="100" rx="18"/>
    <rect x="220" y="150" width="130" height="100" rx="18"/>
    <rect x="398" y="150" width="130" height="100" rx="18"/>
  </g>
  <circle cx="568" cy="200" r="48" fill="#eff6ff" stroke="#2563eb" stroke-width="5"/>
  <g stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)">
    <line x1="176" y1="200" x2="212" y2="200"/>
    <line x1="354" y1="200" x2="390" y2="200"/>
    <line x1="532" y1="200" x2="558" y2="200"/>
  </g>
  <text x="107" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#111827">Residual</text>
  <text x="107" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#111827">Stream</text>
  <text x="285" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#111827">Sparse</text>
  <text x="285" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#111827">Code</text>
  <text x="463" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#111827">Dictionary</text>
  <text x="463" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#111827">Direction</text>
  <text x="568" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#111827">Token</text>
  <text x="568" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#111827">Anchor</text>
</svg>

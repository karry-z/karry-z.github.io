<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">UAV landing on a moving platform</title>
  <desc id="desc">A rotary-wing UAV descending toward a moving platform with feedback-control marks.</desc>
  <rect width="640" height="400" rx="28" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <g stroke="#111827" stroke-width="7" stroke-linecap="round">
    <line x1="232" y1="110" x2="408" y2="110"/>
    <line x1="320" y1="74" x2="320" y2="146"/>
  </g>
  <g fill="#ffffff" stroke="#2563eb" stroke-width="5">
    <circle cx="232" cy="110" r="30"/>
    <circle cx="408" cy="110" r="30"/>
    <circle cx="320" cy="74" r="30"/>
    <circle cx="320" cy="146" r="30"/>
  </g>
  <rect x="273" y="106" width="94" height="58" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="5"/>
  <path d="M 320 182 L 320 256" fill="none" stroke="#2563eb" stroke-width="6" stroke-dasharray="10 11" marker-end="url(#arrow)"/>
  <rect x="176" y="276" width="288" height="42" rx="21" fill="#ffffff" stroke="#94a3b8" stroke-width="4"/>
  <rect x="218" y="318" width="204" height="22" rx="11" fill="#e5e7eb"/>
  <g fill="none" stroke="#2563eb" stroke-width="5" opacity="0.72">
    <path d="M 142 245 C 210 208 256 207 320 238"/>
    <path d="M 498 245 C 430 208 384 207 320 238"/>
  </g>
  <text x="320" y="371" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#111827">adaptive landing control</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Blocks-world relationship evaluation</title>
  <desc id="desc">Colored blocks with arrows showing relationship labels.</desc>
  <rect width="640" height="400" rx="28" fill="#f8fafc"/>
  <rect x="120" y="220" width="110" height="90" rx="12" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/>
  <rect x="250" y="145" width="110" height="90" rx="12" fill="#fde68a" stroke="#ca8a04" stroke-width="4"/>
  <rect x="390" y="220" width="110" height="90" rx="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="4"/>
  <path d="M 230 203 C 255 178 270 169 250 145" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <path d="M 250 145 l 1 28 l -25 -12" fill="#111827"/>
  <path d="M 360 188 C 394 178 420 185 450 220" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <path d="M 450 220 l -27 -8 l 20 -19" fill="#111827"/>
  <text x="175" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#111827">A</text>
  <text x="305" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#111827">B</text>
  <text x="445" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#111827">C</text>
  <rect x="218" y="68" width="204" height="54" rx="27" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text x="320" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#111827">left of / above?</text>

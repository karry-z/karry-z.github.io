<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Audio, vision, and language benchmark map</title>
  <desc id="desc">Three modality nodes connected to a central benchmark map node.</desc>
  <rect width="640" height="400" rx="28" fill="#f8fafc"/>
  <g stroke="#2563eb" stroke-width="6" stroke-linecap="round" opacity="0.72">
    <line x1="160" y1="125" x2="320" y2="200"/>
    <line x1="500" y1="125" x2="320" y2="200"/>
    <line x1="320" y1="320" x2="320" y2="200"/>
  </g>
  <circle cx="320" cy="200" r="72" fill="#eff6ff" stroke="#2563eb" stroke-width="5"/>
  <circle cx="160" cy="125" r="58" fill="#ffffff" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="500" cy="125" r="58" fill="#ffffff" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="320" cy="320" r="58" fill="#ffffff" stroke="#94a3b8" stroke-width="4"/>
  <text x="320" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#111827">Benchmark</text>
  <text x="320" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#111827">Map</text>
  <text x="160" y="133" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#111827">Audio</text>
  <text x="500" y="133" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#111827">Vision</text>
  <text x="320" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#111827">Language</text>
</svg>
